<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="980" viewBox="0 0 1700 980">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4b5563"/>
    </marker>
    <style>
      .title { font: 700 28px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif; fill: #111827; }
      .subtitle { font: 500 16px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif; fill: #475569; }
      .cluster { fill: #ecfdf5; stroke: #10b981; stroke-width: 2.5; }
      .mainbox { fill: #d1fae5; stroke: #64748b; stroke-width: 1.8; }
      .sidebox { fill: #ffffff; stroke: #64748b; stroke-width: 1.8; }
      .boxtitle { font: 700 14px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif; fill: #1f2937; text-anchor: middle; }
      .boxtext { font: 500 13px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif; fill: #334155; text-anchor: middle; }
      .cluster-title { font: 700 24px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif; fill: #065f46; text-anchor: middle; }
      .cluster-note { font: 500 14px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif; fill: #475569; text-anchor: middle; }
      .edge { stroke: #4b5563; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
      .edge-thin { stroke: #64748b; stroke-width: 1.8; fill: none; marker-end: url(#arrow); }
      .edge-dash { stroke: #2563eb; stroke-width: 1.9; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
      .ctrl-dash { stroke: #64748b; stroke-width: 1.7; stroke-dasharray: 8 6; fill: none; marker-end: url(#arrow); }
      .edge-label { font: 500 12px 'Noto Sans CJK SC','Microsoft YaHei','PingFang SC',sans-serif; fill: #374151; text-anchor: middle; }
    </style>
  </defs>

  <text x="850" y="52" class="title" text-anchor="middle">CPU 五级流水内部结构图 / Core Pipeline Architecture</text>
  <text x="850" y="82" class="subtitle" text-anchor="middle">用于说明取指、译码、执行、访存、回写，以及前递、分支预测和冒险控制</text>

  <rect x="50" y="110" rx="24" ry="24" width="1600" height="800" class="cluster"/>
  <text x="850" y="150" class="cluster-title">riscv_core 内部结构</text>
  <text x="850" y="176" class="cluster-note">IF1/IF2 前端缓冲、IF/ID、ID/EX、EX/MEM、MEM/WB 流水寄存器与控制通路</text>

  <rect x="90" y="220" rx="16" ry="16" width="170" height="110" class="sidebox"/>
  <text x="175" y="257" class="boxtitle">Hazard Control</text>
  <text x="175" y="281" class="boxtext">stall / flush</text>
  <text x="175" y="304" class="boxtext">load-use / mul / div / MMIO</text>

  <rect x="930" y="165" rx="16" ry="16" width="220" height="92" class="sidebox"/>
  <text x="1040" y="198" class="boxtitle">Branch Predictor</text>
  <text x="1040" y="222" class="boxtext">BTB + GShare</text>

